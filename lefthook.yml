lefthook: bunx --no-install lefthook
min_version: 2.2.2

pre-commit:
  commands:
    whitespace:
      run: git diff --cached --check
    rustfmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check
    oxlint:
      glob: "*.{js,mjs,cjs,ts,mts,cts}"
      run: bunx --no-install oxlint --deny-warnings --no-error-on-unmatched-pattern {staged_files}
    oxfmt:
      glob: "*.{js,mjs,cjs,ts,mts,cts,json,jsonc,md,yml,yaml,toml}"
      run: bunx --no-install oxfmt --check --no-error-on-unmatched-pattern {staged_files}

pre-push:
  commands:
    clippy:
      glob: "{*.rs,Cargo.toml,Cargo.lock,rust-toolchain.toml}"
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
