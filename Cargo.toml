[package]
name = "piston-proxy-bot"
version = "1.0.0"
edition = "2024"
rust-version = "1.97"
description = "Share proxies on Discord"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]
members = ["crates/commands", "crates/register"]
resolver = "3"

[dependencies]
ed25519-compact = { version = "2.3.1", default-features = false, features = ["opt_size", "std"] }
hex = "0.4.3"
piston-proxy-commands = { path = "crates/commands" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
twilight-model = "0.17.1"
worker = "0.8.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
