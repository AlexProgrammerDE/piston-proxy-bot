[package]
name = "piston-proxy-bot"
version = "1.0.0"
edition = "2024"
rust-version = "1.97"
description = "Share proxies on Discord"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]
members = ["crates/commands", "crates/register"]
resolver = "3"

[lints]
workspace = true

[dependencies]
ed25519-compact = { version = "2.3.1", default-features = false, features = ["opt_size", "std"] }
hex = "0.4.3"
piston-proxy-commands = { path = "crates/commands" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
twilight-model = "0.18.0"
worker = "0.9.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
map_err_ignore = "warn"
unused_result_ok = "warn"
redundant_clone = "warn"

# Safety and correctness
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
string_slice = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
exit = "warn"
rc_buffer = "warn"
fn_to_numeric_cast_any = "warn"
infinite_loop = "warn"
try_err = "warn"
rest_pat_in_fully_bound_structs = "warn"
iter_over_hash_type = "warn"
let_underscore_must_use = "warn"
significant_drop_tightening = "warn"

# Better test failures
assertions_on_result_states = "warn"
missing_assert_message = "warn"
