name: Fuzz

on:
  pull_request:
    paths:
      - ".github/workflows/fuzz.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "fuzz/**"
      - "src/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/fuzz.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "fuzz/**"
      - "src/**"
  schedule:
    - cron: "37 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  TOOLCHAIN: nightly-2026-11-01
  # The prebuilt cargo-fuzz binary is static musl and would default to a musl
  # target, which AddressSanitizer does not support.
  FUZZ_TARGET_TRIPLE: x86_64-unknown-linux-gnu

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - multipart_round_trip
          - verify_signature
          - register_application_id
    env:
      TARGET: ${{ matrix.target }}
      # Short runs for pull requests and pushes, longer scheduled runs.
      SECONDS_PER_TARGET: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '600' || '60' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust nightly
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-fuzz@0.13.2

      - name: Restore corpus
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Build fuzz target
        run: cargo "+$TOOLCHAIN" fuzz build --target "$FUZZ_TARGET_TRIPLE" "$TARGET"

      - name: Run fuzz target
        run: |
          mkdir -p "fuzz/corpus/$TARGET"
          cargo "+$TOOLCHAIN" fuzz run --target "$FUZZ_TARGET_TRIPLE" "$TARGET" "fuzz/corpus/$TARGET" "fuzz/seeds/$TARGET" -- \
            -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048 -timeout=10

      - name: Save corpus
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
          if-no-files-found: ignore
